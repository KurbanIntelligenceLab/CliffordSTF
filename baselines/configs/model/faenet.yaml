# FAENet baseline with stochastic 3D frame averaging. Requires the
# [baselines] extra (pip install cliffordstf[baselines]) so that
# the faenet package is available.
model:
  name: faenet
  cutoff: 6.0
  max_num_neighbors: 40
  hidden_channels: 320
  num_interactions: 4
  num_gaussians: 50
  num_filters: 128
  act: swish
  skip_co: concat
  mp_type: updownscale_base
  second_layer_MLP: true
  graph_norm: true
  complex_mp: false
  phys_embeds: true
  phys_hidden_channels: 0
  tag_hidden_channels: 0
  pg_hidden_channels: 0
  frame_averaging: "3D"
  fa_method: stochastic
