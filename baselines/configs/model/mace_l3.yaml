# MACE L=3 baseline. Requires the [baselines] extra.
model:
  name: mace_l3
  max_ell: 3
  hidden_irreps: "28x0e + 28x1o + 28x2e + 28x3o"
  num_interactions: 2
  correlation: 3
  num_bessel: 8
  num_polynomial_cutoff: 5
  cutoff: 6.0
  max_neighbors: 50
  num_elements: 100
  MLP_irreps: "16x0e"
  avg_num_neighbors: 50.0
