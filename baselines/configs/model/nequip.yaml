# NequIP baseline (e3nn-backed). Requires the [baselines] extra
# (pip install cliffordstf[baselines]) so that nequip is available.
model:
  name: nequip
  r_max: 6.0
  num_layers: 4
  l_max: 1
  parity: true
  num_features: 44
  radial_mlp_depth: 2
  radial_mlp_width: 72
  num_bessels: 8
  polynomial_cutoff_p: 6
  max_num_elements: 90
