[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cliffordstf"
version = "0.1.0"
description = "CliffordSTF: a steerable tensor-field model on Clifford algebras for machine learning interatomic potentials."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = "==3.12.*"
authors = [
  { name = "Can Polat" },
  { name = "Erchin Serpedin" },
  { name = "Mustafa Kurban" },
  { name = "Hasan Kurban" },
]
keywords = ["clifford", "geometric-algebra", "mlip", "machine-learning-interatomic-potentials", "equivariant", "molecular-dynamics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "omegaconf>=2.3",
  "pytorch-lightning>=2.2",
  "torch>=2.1",
  "torch_geometric>=2.5",
  "torch_scatter>=2.1",
  "torch_sparse>=0.6",
  "torch_cluster>=1.6",
  "scikit-learn>=1.8.0",
  "lmdb>=2.2.0",
]

[project.scripts]
cliffordstf-train = "cliffordstf.cli:main"

[project.urls]
Homepage = "https://github.com/KurbanIntelligenceLab/CliffordSTF"
Repository = "https://github.com/KurbanIntelligenceLab/CliffordSTF"
Issues = "https://github.com/KurbanIntelligenceLab/CliffordSTF/issues"
Paper = "https://arxiv.org/abs/2606.29584"

[dependency-groups]
dev = ["pytest>=8.0"]
analysis = [
  "pandas>=2.0",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
]

[tool.uv.extra-build-dependencies]
torch-scatter = [{ requirement = "torch", match-runtime = true }]
torch-sparse = [{ requirement = "torch", match-runtime = true }]
torch-cluster = [{ requirement = "torch", match-runtime = true }]

[tool.hatch.build.targets.wheel]
packages = ["src/cliffordstf"]

[tool.hatch.build.targets.sdist]
include = [
  "src/cliffordstf",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
