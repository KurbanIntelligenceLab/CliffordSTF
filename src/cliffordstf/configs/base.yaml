seed: 42
device: auto
output_root: outputs

training:
  batch_size: 32
  num_workers: 0
  pin_memory: false
  persistent_workers: false
  prefetch_factor: 2
  epochs: 100
  lr: 1.0e-3
  optimizer: adam
  weight_decay: 0.0
  lr_scheduler: null
  loss: mse
  grad_clip: 0.0
  grad_accum_steps: 1
  val_every: 1
  amp: false
  amp_dtype: bfloat16
  early_stopping:
    patience: 0

logging:
  print_every: 1
