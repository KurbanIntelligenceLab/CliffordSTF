model:
  name: clifford_stf
  interface: data_wrapper
  n_atom_types: 100
  n_channels: 60
  n_interactions: 5
  n_rbf: 50
  cutoff: 6.0
  n_hidden_output: 60
  max_neighbors: 50
  # CliffordSTF: full 20D features (Cl(3,0) + STF₂ + STF₃)
  stf_mode: "stf2+stf3"
  use_hodge_forces: true
  use_cross_track: true
  # Disabled based on ablation (both improved accuracy when off)
  use_self_interaction: false
  use_gp_readout: false
  # torch.compile blocked by torch_scatter FX-trace incompat + dynamic shapes
  use_compile: false
