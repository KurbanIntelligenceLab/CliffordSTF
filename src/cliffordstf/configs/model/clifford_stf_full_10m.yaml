model:
  name: clifford_stf_full_10m
  interface: data_wrapper
  n_atom_types: 100
  n_channels: 188
  n_interactions: 5
  n_rbf: 50
  cutoff: 6.0
  n_hidden_output: 256
  max_neighbors: 50
  # STF features
  stf_mode: "stf2+stf3"
  use_hodge_forces: true
  use_adaptive_routing: true
  routing_mode: "learned"
  use_cross_track: true
  use_self_interaction: false
  use_gp_readout: false
